spring:
  application:
    name: challenge-pet

  datasource:
    # As variaveis de ambiente permitem trocar o destino do banco sem recompilar.
    # Os valores apos ":" sao os defaults de desenvolvimento (docker-compose local).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pethealth}
    username: ${DB_USERNAME:pethealth}
    password: ${DB_PASSWORD:pethealth}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # validate: o Hibernate apenas confere se as entidades batem com o schema
      # criado pelo Flyway. Nunca cria nem altera tabelas.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    # URI completa do broker. Local: o RabbitMQ do docker-compose. No Render:
    # a URL do CloudAMQP (amqps://usuario:senha@host/vhost) -- o prefixo amqps
    # liga o TLS automaticamente.
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
    # Sem broker, desiste da conexao rapido em vez de prender a thread por 60s.
    connection-timeout: 5s
    listener:
      simple:
        # Uma mensagem que falhou em todas as tentativas e rejeitada sem voltar
        # para a fila -- e o que a encaminha para a DLQ.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

  thymeleaf:
    cache: false

  cache:
    type: simple

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true

server:
  port: ${PORT:8080}

logging:
  level:
    org.flywaydb: INFO
    br.com.fiap.challenge.messaging: INFO
