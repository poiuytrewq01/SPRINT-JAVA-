<!DOCTYPE html>
<!--
  A tela de login nao usa o layout: ela nao tem menu nem identificacao de
  usuario, que sao justamente o conteudo do cabecalho compartilhado.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PetHealth | Entrar</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="tela-login">
    <div class="caixa-login">
        <h1>PetHealth</h1>
        <p class="subtitulo">Saude e cuidado continuo do seu pet.</p>

        <div class="aviso erro" th:if="${erroLogin}" role="alert">
            E-mail ou senha invalidos.
        </div>
        <div class="aviso sucesso" th:if="${logoutRealizado}" role="status">
            Sessao encerrada.
        </div>

        <!--
          O action aponta para /login, processado pelo filtro do Spring
          Security. Os campos se chamam "email" e "password" porque foi assim
          que usernameParameter e passwordParameter ficaram configurados no
          SecurityConfig.

          O token CSRF e inserido automaticamente pelo Thymeleaf em todo form
          com th:action e method="post". Sem ele, a requisicao seria recusada
          com 403.
        -->
        <form th:action="@{/login}" method="post">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required autofocus
                       autocomplete="username" placeholder="voce@email.com">
            </div>

            <div class="campo">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password" placeholder="Sua senha">
            </div>

            <button type="submit" class="botao" style="width:100%">Entrar</button>
        </form>

        <div class="credenciais-demo">
            <strong>Usuarios de demonstracao</strong> &mdash; senha <code>senha123</code>
            <table>
                <tr><td>Tutora</td><td>maria@email.com</td></tr>
                <tr><td>Tutor</td><td>joao@email.com</td></tr>
                <tr><td>Veterinaria</td><td>ana@clinicapet.com</td></tr>
                <tr><td>Veterinario</td><td>carlos@clinicapet.com</td></tr>
                <tr><td>Administrador</td><td>admin@pethealth.com</td></tr>
            </table>
        </div>
    </div>
</div>

</body>
</html>
