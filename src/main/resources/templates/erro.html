<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina('Erro', ~{:: main})}" lang="pt-BR">
<body>
<main>
    <div class="cartao" style="text-align:center">
        <h1 th:text="${erroTitulo} ?: 'Algo deu errado'">Algo deu errado</h1>
        <p class="subtitulo" th:text="${erroMensagem} ?: 'Nao foi possivel concluir a operacao.'"></p>
        <div class="acoes" style="justify-content:center; margin-top:1rem">
            <a class="botao" th:href="@{/}">Voltar para a minha area</a>
        </div>
    </div>
</main>
</body>
</html>
